<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>北京时间时间码</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="stage" aria-label="北京时间截图时间码">
      <div id="canvas">
        <img id="background" alt="原始截图底图" />
        <div id="emptyState" class="empty-state">
          <span>未找到默认底图</span>
          <small>点右下角按钮上传图片</small>
        </div>
        <div id="artboard" aria-label="原图时间码坐标层">
          <img id="contentImage" alt="下方替换照片" />
          <div id="topMask" class="mask" aria-hidden="true"></div>
          <output id="topTime" class="time top-time" aria-label="北京时间小时分钟"></output>
          <div id="bottomMask" class="mask" aria-hidden="true"></div>
          <output id="bottomTime" class="time bottom-time" aria-label="北京时间日期和时间"></output>
        </div>
      </div>
      <div id="status" class="status" role="status">正在尝试网络校准…</div>
    </main>

    <button id="openControls" class="round-button" aria-label="打开设置">⚙</button>
    <section id="controls" class="controls" aria-label="时间码设置" hidden>
      <header><strong>时间码设置</strong><button id="closeControls" aria-label="关闭设置">×</button></header>
      <label class="upload-label">替换底图<input id="imageInput" type="file" accept="image/*" /></label>
      <label class="upload-label">替换整张照片<input id="contentImageInput" type="file" accept="image/*" /></label>
      <button id="clearContentImage" type="button">清除替换照片</button>
      <button id="fullScreen">全屏显示</button>
      <button id="calibrate">重新校准时间</button>
      <div class="adjustments">
        <p>拖动滑块，或直接拖动画面上的时间码；会自动保存。</p>
        <label><span>左上 横向</span><input id="topX" type="range" min="0" max="100" step="0.05" /><output id="topXValue"></output></label>
        <label><span>左上 纵向</span><input id="topY" type="range" min="0" max="100" step="0.05" /><output id="topYValue"></output></label>
        <label><span>日期 横向</span><input id="bottomX" type="range" min="0" max="100" step="0.05" /><output id="bottomXValue"></output></label>
        <label><span>日期 纵向</span><input id="bottomY" type="range" min="0" max="100" step="0.05" /><output id="bottomYValue"></output></label>
        <label><span>左上 字号</span><input id="topSize" type="range" min="20" max="70" step="1" /><output id="topSizeValue"></output></label>
        <label><span>日期 字号</span><input id="bottomSize" type="range" min="20" max="80" step="1" /><output id="bottomSizeValue"></output></label>
      </div>
      <button id="resetLayout" type="button">恢复默认位置和大小</button>
      <p class="hint">替换照片会从手机画布最顶部铺满。设置只保存在这台设备上。</p>
    </section>
    <script src="app.js"></script>
  </body>
</html>
